<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalkUp Songs — Team Shared With You</title>
    <meta name="description" content="Import this team into WalkUp Songs on iOS or Android.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-itunes-app" content="app-id=6760240442">
    <meta property="og:title" content="WalkUp Songs — Team Shared With You">
    <meta property="og:description" content="Tap to import this team into WalkUp Songs.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://walkupsongs.app/share/">
    <meta property="og:image" content="https://walkupsongs.app/icon.png">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://walkupsongs.app/share/">
    <link rel="icon" href="/icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: #1a2035;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .icon-img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .team-name {
            font-size: 28px;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 20px;
        }
        .status {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
            line-height: 1.5;
            max-width: 340px;
        }
        .roster {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 24px;
            text-align: left;
            max-width: 320px;
            width: 100%;
        }
        .roster h3 {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .roster .player {
            font-size: 15px;
            padding: 4px 0;
            color: rgba(255,255,255,0.85);
        }
        .roster .player .num {
            color: #fbbf24;
            font-weight: 700;
            margin-right: 6px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            display: inline-block;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.1s, opacity 0.15s;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.97); }
        .btn-open {
            background: #2563eb;
            color: #fff;
        }
        .store-btn {
            background: #fff;
            color: #1a2035;
        }
        .store-btn.primary {
            background: #2563eb;
            color: #fff;
        }
        .hint {
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            max-width: 320px;
            line-height: 1.4;
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
        }
        .footer a { color: rgba(255,255,255,0.55); text-decoration: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <img class="icon-img" src="/icon.png" width="72" height="72" alt="WalkUp Songs">
    <h1>WalkUp Songs</h1>
    <div class="team-name" id="teamName">Team Shared With You</div>
    <div class="roster hidden" id="roster">
        <h3>Roster</h3>
        <div id="rosterList"></div>
    </div>
    <p class="status" id="status">Opening WalkUp Songs…</p>

    <div class="actions">
        <button type="button" class="btn btn-open" id="openBtn">Open in WalkUp Songs</button>
        <a class="btn store-btn hidden" id="storeBtn"
           href="https://apps.apple.com/app/walk-up-songs/id6760240442">
            Download on the App Store
        </a>
        <a class="btn store-btn hidden" id="playBtn"
           href="https://play.google.com/store/apps/details?id=com.walkupsongs.app">
            Get it on Google Play
        </a>
    </div>
    <p class="hint hidden" id="hint">
        If the app doesn’t open, install WalkUp Songs, then return to this link or scan the QR again.
    </p>
    <p class="footer">
        <a href="https://walkupsongs.app/">walkupsongs.app</a> ·
        <a href="https://walkupsongs.app/support/">Support</a>
    </p>

    <script src="/js/share-landing.js"></script>
    <script>
        (function () {
            var W = window.WalkUpShareLanding;
            var params = new URLSearchParams(window.location.search);
            var encoded = params.get('data') || (window.location.hash ? window.location.hash.substring(1) : '');
            var version = params.get('v');

            function showTeam(data) {
                if (!data || !data.name) return;
                document.getElementById('teamName').textContent = data.name;
                document.title = 'WalkUp Songs — ' + data.name;

                if (data.players && data.players.length > 0) {
                    var roster = document.getElementById('roster');
                    var list = document.getElementById('rosterList');
                    list.innerHTML = '';
                    var players = data.players.filter(function (p) { return p.inLineup; });
                    if (players.length === 0) players = data.players;

                    players.slice(0, 12).forEach(function (p) {
                        var div = document.createElement('div');
                        div.className = 'player';
                        var first = p.firstName || '';
                        var last = p.lastName || '';
                        div.innerHTML = '<span class="num">#' + p.number + '</span>' +
                            (first + ' ' + last).trim();
                        list.appendChild(div);
                    });
                    if (data.players.length > 12) {
                        var more = document.createElement('div');
                        more.className = 'player';
                        more.style.color = 'rgba(255,255,255,0.4)';
                        more.textContent = '+ ' + (data.players.length - 12) + ' more';
                        list.appendChild(more);
                    }
                    roster.classList.remove('hidden');
                }
            }

            W.decodeSharePayload(encoded, version).then(showTeam);

            document.getElementById('openBtn').addEventListener('click', function () {
                W.openAppNow('share');
            });

            if (encoded) {
                W.tryOpenApp('share');
            } else {
                document.getElementById('status').textContent =
                    'This share link is missing team data. Ask the sender to share again.';
            }

            setTimeout(function () {
                document.getElementById('status').textContent =
                    'Don’t have WalkUp Songs yet? Get it free on iOS and Android.';
                var ios = document.getElementById('storeBtn');
                var droid = document.getElementById('playBtn');
                ios.classList.remove('hidden');
                droid.classList.remove('hidden');
                document.getElementById('hint').classList.remove('hidden');
                W.applyStorePriority(ios, droid);
            }, 1600);
        })();
    </script>
</body>
</html>
